<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Tool Htung Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #0062FF;
    --primary-dark: #004FCC;
    --secondary: #00B4FF;
    --text: #0F172A;
    --muted: #64748B;
    --border: #E2E8F0;
    --bg: #F1F5F9;
    --card: #FFFFFF;
    --ok: #059669;
    --ok-bg: #D1FAE5;
    --err: #DC2626;
    --err-bg: #FEE2E2;
    --font-h: 'Plus Jakarta Sans', sans-serif;
    --font-b: 'Inter', sans-serif;
    --font-m: 'JetBrains Mono', monospace;
    --radius: 14px;
    --shadow: 0 4px 24px rgba(0, 98, 255, 0.08);
  }
  body {
    font-family: var(--font-b);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .wrap { display: flex; flex-direction: column; height: 100vh; }

  /* Header */
  .topbar {
    background: #fff;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 13px; font-family: var(--font-h);
  }
  .brand-text { display: flex; flex-direction: column; }
  .brand-name { font-family: var(--font-h); font-weight: 800; font-size: 16px; line-height: 1.1; letter-spacing: -0.2px; }
  .brand-ver { font-size: 10px; color: var(--muted); font-weight: 500; }
  .actions { display: flex; gap: 8px; }
  .btn {
    border: none; border-radius: 10px; padding: 9px 14px;
    font-family: var(--font-h); font-size: 12px; font-weight: 700;
    cursor: pointer; transition: 0.15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-danger { background: #EF4444; color: #fff; }
  .btn-ghost { background: #F1F5F9; color: var(--text); border: 1px solid var(--border); }

  /* Info bar */
  .infobar {
    background: linear-gradient(135deg, #0062FF, #0090FF);
    color: #fff;
    padding: 14px 16px;
    display: none;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 6px 20px rgba(0, 98, 255, 0.22);
  }
  .infobar.show { display: flex; }
  .game-title { font-family: var(--font-h); font-weight: 800; font-size: 15px; }
  .game-phien { font-family: var(--font-m); font-size: 11px; opacity: 0.9; margin-top: 2px; }
  .stats { display: flex; gap: 8px; }
  .stat {
    background: rgba(255,255,255,0.18);
    border-radius: 10px;
    padding: 6px 11px;
    text-align: center;
    min-width: 54px;
  }
  .stat .num { font-family: var(--font-h); font-size: 16px; font-weight: 800; line-height: 1; }
  .stat .lbl { font-size: 9px; font-weight: 700; margin-top: 2px; opacity: 0.9; letter-spacing: 0.3px; }

  /* Table */
  .content { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
  .table-card {
    background: var(--card);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  table { width: 100%; border-collapse: collapse; text-align: center; font-size: 12px; }
  th {
    background: #F8FAFC;
    color: var(--primary);
    font-family: var(--font-h);
    font-weight: 800;
    padding: 12px 4px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 11px 4px;
    border-bottom: 1px solid #F1F5F9;
    font-weight: 700;
    color: #1E293B;
    font-variant-numeric: tabular-nums;
  }
  tr:last-child td { border-bottom: none; }
  th:nth-child(1) { width: 18%; }
  th:nth-child(2) { width: 16%; }
  th:nth-child(3) { width: 18%; }
  th:nth-child(4) { width: 16%; }
  th:nth-child(5) { width: 16%; }
  th:nth-child(6) { width: 16%; }

  .pill {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 8px;
    font-family: var(--font-h);
    font-size: 11px;
    font-weight: 800;
  }
  .pill.tai { background: #DCFCE7; color: #166534; }
  .pill.xiu { background: #FEE2E2; color: #991B1B; }

  .badge {
    display: inline-block;
    padding: 5px 8px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 800;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.err { background: var(--err-bg); color: var(--err); }

  .row-next { background: linear-gradient(90deg, #EFF6FF, #F0F9FF); }
  .row-next td { font-weight: 800; }
  .waiting { color: var(--primary); font-style: italic; font-weight: 700; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(6px);
    display: flex; justify-content: center; align-items: center;
    z-index: 9999; padding: 18px;
  }
  .modal {
    width: 100%; max-width: 420px; max-height: 82vh;
    background: #fff; border-radius: 20px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  }
  .modal-head {
    padding: 18px 18px 14px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h3 {
    font-family: var(--font-h);
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }
  .modal-head p { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .game-list {
    padding: 12px;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .section {
    font-family: var(--font-h);
    font-size: 11px;
    color: var(--primary);
    font-weight: 800;
    margin: 4px 0 2px 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .game-item {
    border: 1.5px solid var(--border);
    padding: 13px 14px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.15s;
    background: #fff;
  }
  .game-item:active {
    transform: scale(0.985);
    border-color: var(--primary);
    background: #F8FAFC;
  }
  .game-item .left { display: flex; flex-direction: column; gap: 4px; }
  .game-item .name { font-family: var(--font-h); font-size: 14px; font-weight: 800; }
  .game-item .pred {
    font-size: 12px; font-weight: 600;
    display: flex; gap: 7px; align-items: center;
  }
  .tag-tai { color: #166534; background: #DCFCE7; padding: 2px 7px; border-radius: 6px; font-weight: 700; font-size: 11px; }
  .tag-xiu { color: #991B1B; background: #FEE2E2; padding: 2px 7px; border-radius: 6px; font-weight: 700; font-size: 11px; }
  .acc {
    font-family: var(--font-m);
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    background: #EFF6FF;
    padding: 5px 9px;
    border-radius: 8px;
  }
  .empty { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="overlay" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h3>Tool Htung Bot</h3>
      <p>Tài Xỉu • MD5 • Sicbo • Real-time</p>
    </div>
    <div class="game-list" id="game-list">
      <div class="empty">Đang tải danh sách...</div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">TX</div>
      <div class="brand-text">
        <span class="brand-name">Tool Htung Bot</span>
        <span class="brand-ver">v15.9</span>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-danger" onclick="resetLearn()">RESET</button>
      <button class="btn btn-ghost" onclick="backToList()">ĐỔI GAME</button>
    </div>
  </div>

  <div class="infobar" id="infobar">
    <div>
      <div class="game-title" id="info-name">—</div>
      <div class="game-phien" id="info-phien">Phiên: —</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num" id="s-win">0</div><div class="lbl">THẮNG</div></div>
      <div class="stat"><div class="num" id="s-lose">0</div><div class="lbl">THUA</div></div>
      <div class="stat"><div class="num" id="s-rate">0%</div><div class="lbl">TỈ LỆ</div></div>
    </div>
  </div>

  <div class="content">
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>GAME</th>
            <th>PHIÊN</th>
            <th>THỜI GIAN</th>
            <th>DỰ ĐOÁN</th>
            <th>KẾT QUẢ</th>
            <th>XÁC MINH</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6" style="text-align:center;padding:48px;color:#94a3b8">Chọn game để bắt đầu...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
let currentId = null;
let timer = null;
let lastHash = '';

async function loadGames() {
  try {
    const res = await fetch('/api/games');
    const json = await res.json();
    const list = json.games || [];
    const groups = { tx: [], md5: [], sicbo: [] };
    for (const g of list) {
      if (g.group === 'sicbo') groups.sicbo.push(g);
      else if (g.group === 'md5') groups.md5.push(g);
      else groups.tx.push(g);
    }

    let html = '';
    const render = (title, arr) => {
      if (!arr.length) return;
      html += `<div class="section">${title}</div>`;
      for (const g of arr) {
        const cls = (g.pred || '').includes('TÀI') || (g.pred || '').includes('Tài') ? 'tag-tai' : 'tag-xiu';
        html += `
          <div class="game-item" onclick="selectGame('${g.id}','${g.name.replace(/'/g,"\\'")}')">
            <div class="left">
              <span class="name">${g.name}</span>
              <span class="pred">Dự đoán: <span class="${cls}">${g.pred || '—'}</span>
                <span style="color:#94a3b8;font-size:11px">(${g.conf || 0}%)</span>
              </span>
            </div>
            <div class="acc">${g.acc || 0}%</div>
          </div>`;
      }
    };

    render('TÀI XỈU', groups.tx);
    render('MD5', groups.md5);
    render('SICBO', groups.sicbo);

    if (!html) html = '<div class="empty">Không có game</div>';
    document.getElementById('game-list').innerHTML = html;
  } catch (e) {
    document.getElementById('game-list').innerHTML = '<div class="empty">Lỗi tải danh sách</div>';
  }
}

function selectGame(id, name) {
  currentId = id;
  document.getElementById('modal').style.display = 'none';
  document.getElementById('infobar').classList.add('show');
  document.getElementById('info-name').innerText = name;
  document.getElementById('tbody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#94a3b8">Đang tải dữ liệu...</td></tr>';
  lastHash = '';
  if (timer) clearInterval(timer);
  fetchData();
  timer = setInterval(fetchData, 3000);
}

function backToList() {
  if (timer) { clearInterval(timer); timer = null; }
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('infobar').classList.remove('show');
  document.getElementById('tbody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:48px;color:#94a3b8">Chọn game để bắt đầu...</td></tr>';
  loadGames();
}

function cleanText(t) {
  if (!t) return t;
  // Bỏ số vị (3-4-5) và icon cảnh báo
  return String(t)
    .replace(/\s*\(\d+-\d+-\d+\)/g, '')
    .replace(/[⚠️🎯⏳]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

async function fetchData() {
  if (!currentId) return;
  try {
    const res = await fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ apiId: currentId })
    });
    const json = await res.json();
    if (!json.rows || !json.rows.length) return;

    const hash = json.rows.map(r => r.phien + r.result + r.verify).join('|');
    if (hash === lastHash) return;
    lastHash = hash;

    let html = '';
    let win = 0, lose = 0;

    for (const r of json.rows) {
      const pred = cleanText(r.prediction);
      const result = cleanText(r.result);
      const verify = cleanText(r.verify);

      if (r.isNext) {
        document.getElementById('info-phien').innerText = 'Phiên: #' + r.phien;
        const cls = pred.includes('Tài') || pred.includes('TÀI') ? 'tai' : 'xiu';
        html += `<tr class="row-next">
          <td><span style="color:var(--primary);font-weight:800">${r.game}</span></td>
          <td style="font-family:var(--font-m)">#${r.phien}</td>
          <td style="font-size:11px;color:#94a3b8">${r.time}</td>
          <td><span class="pill ${cls}">${pred}</span></td>
          <td class="waiting">Chờ...</td>
          <td class="waiting">...</td>
        </tr>`;
      } else {
        if (r.isCorrect === true) win++;
        else if (r.isCorrect === false) lose++;
        const pCls = pred.includes('Tài') || pred.includes('TÀI') ? 'tai' : 'xiu';
        const rCls = result.includes('Tài') || result.includes('TÀI') ? 'tai' : 'xiu';
        const vCls = r.isCorrect ? 'ok' : 'err';
        const vText = r.isCorrect ? 'ĐÚNG' : 'SAI';
        html += `<tr>
          <td><span style="color:var(--primary);font-weight:800">${r.game}</span></td>
          <td style="font-family:var(--font-m)">#${r.phien}</td>
          <td style="font-size:11px;color:#94a3b8">${r.time}</td>
          <td><span class="pill ${pCls}">${pred}</span></td>
          <td><span class="pill ${rCls}">${result}</span></td>
          <td><span class="badge ${vCls}">${vText}</span></td>
        </tr>`;
      }
    }

    document.getElementById('tbody').innerHTML = html;
    const total = win + lose;
    document.getElementById('s-win').innerText = win;
    document.getElementById('s-lose').innerText = lose;
    document.getElementById('s-rate').innerText = total ? Math.round((win / total) * 100) + '%' : '0%';
  } catch (e) { console.error(e); }
}

async function resetLearn() {
  if (!currentId) return alert('Vui lòng chọn game trước!');
  if (!confirm('Reset dữ liệu học máy của game này?')) return;
  await fetch('/reset-learn', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ apiId: currentId })
  });
  lastHash = '';
  fetchData();
}

loadGames();
setInterval(() => {
  if (document.getElementById('modal').style.display !== 'none') loadGames();
}, 5000);
</script>
</body>
</html>
