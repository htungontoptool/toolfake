<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ToolGame — HTUNGG</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  :root {
    --primary: #0062FF;
    --primary-dark: #0047C7;
    --secondary: #00C2FF;
    --accent: #7C3AED;
    --text-main: #0F172A;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --bg-main: #F1F5F9;
    --bg-soft: #F8FAFC;
    --ok-bg: #D1FAE5;
    --err-bg: #FEE2E2;
    --font-head: 'Plus Jakarta Sans', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    --radius: 14px;
  }

  body {
    font-family: var(--font-body);
    background: var(--bg-main);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .khung {
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .thanh-tren {
    background: #fff;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    z-index: 20;
    box-shadow: 0 1px 0 rgba(0,0,0,0.03);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    font-family: var(--font-head);
  }

  .logo-text {
    display: flex;
    flex-direction: column;
  }

  .lg-main {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 15px;
    color: var(--text-main);
    line-height: 1.1;
  }

  .credit {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .btn-group {
    display: flex;
    gap: 8px;
  }

  .nut {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 9px 14px;
    border-radius: 10px;
    font-family: var(--font-head);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .nut:active {
    transform: scale(0.96);
  }

  .nut.reset {
    background: #EF4444;
  }

  .nut.secondary {
    background: #F1F5F9;
    color: var(--text-main);
    border: 1px solid var(--border);
  }

  /* Info bar */
  .info-bar {
    background: linear-gradient(135deg, var(--primary), #0090FF);
    color: #fff;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 6px 20px rgba(0, 98, 255, 0.25);
    z-index: 15;
  }

  .info-game .ten-game {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.2px;
  }

  .info-game .phien {
    font-family: var(--font-mono);
    font-size: 11px;
    opacity: 0.85;
    margin-top: 2px;
  }

  .info-stats {
    display: flex;
    gap: 8px;
  }

  .thong-ke {
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(4px);
    border-radius: 10px;
    padding: 7px 12px;
    text-align: center;
    min-width: 58px;
  }

  .thong-ke .so {
    font-family: var(--font-head);
    font-size: 17px;
    font-weight: 800;
    line-height: 1;
  }

  .thong-ke .nhan {
    font-size: 9px;
    font-weight: 700;
    margin-top: 3px;
    letter-spacing: 0.3px;
    opacity: 0.9;
  }

  /* Table area */
  .vung-bang {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    background: var(--bg-main);
    -webkit-overflow-scrolling: touch;
  }

  .table-wrap {
    background: #fff;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
    font-size: 12px;
  }

  th {
    background: #F8FAFC;
    color: var(--primary);
    font-family: var(--font-head);
    font-weight: 800;
    padding: 13px 6px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 12px 6px;
    border-bottom: 1px solid #F1F5F9;
    font-weight: 600;
    color: #334155;
    font-variant-numeric: tabular-nums;
  }

  tr:last-child td {
    border-bottom: none;
  }

  th:nth-child(1) { width: 18%; }
  th:nth-child(2) { width: 16%; }
  th:nth-child(3) { width: 16%; }
  th:nth-child(4) { width: 20%; }
  th:nth-child(5) { width: 15%; }
  th:nth-child(6) { width: 15%; }

  .pill {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 8px;
    font-family: var(--font-head);
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
  }

  .pill.tai {
    background: #DCFCE7;
    color: #166534;
  }

  .pill.xiu {
    background: #FEE2E2;
    color: #991B1B;
  }

  .verify {
    display: inline-block;
    padding: 5px 8px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 800;
  }

  .verify.dung {
    background: var(--ok-bg);
    color: #059669;
  }

  .verify.sai {
    background: var(--err-bg);
    color: #DC2626;
  }

  .hang-tiep {
    background: linear-gradient(90deg, #EFF6FF, #F0F9FF);
  }

  .hang-tiep td {
    font-weight: 800;
  }

  .cho {
    color: var(--primary);
    font-style: italic;
    font-weight: 700;
  }

  /* Modal chọn game */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(6px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 20px;
  }

  .the {
    width: 100%;
    max-width: 420px;
    max-height: 82vh;
    background: #fff;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  }

  .the-header {
    padding: 20px 20px 16px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  .the-header h3 {
    color: var(--text-main);
    font-family: var(--font-head);
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }

  .the-header .sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
    font-weight: 500;
  }

  .ds-game {
    padding: 14px;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .phan-loai {
    font-family: var(--font-head);
    font-size: 11px;
    color: var(--primary);
    font-weight: 800;
    margin: 6px 0 2px 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .o-game {
    border: 1.5px solid var(--border);
    padding: 14px 16px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.2s ease;
    background: #fff;
  }

  .o-game:active {
    transform: scale(0.985);
    border-color: var(--primary);
    background: #F8FAFC;
  }

  .o-game .left {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .o-game .name {
    font-family: var(--font-head);
    font-size: 14px;
    font-weight: 700;
    color: var(--text-main);
  }

  .o-game .pred-mini {
    font-size: 12px;
    font-weight: 600;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .o-game .tag-tai {
    color: #166534;
    background: #DCFCE7;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 11px;
  }

  .o-game .tag-xiu {
    color: #991B1B;
    background: #FEE2E2;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 11px;
  }

  .o-game .winrate {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    background: #EFF6FF;
    padding: 6px 10px;
    border-radius: 8px;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }
</style>
</head>
<body>

<!-- MODAL CHỌN GAME -->
<div class="overlay" id="modal-chon">
  <div class="the">
    <div class="the-header">
      <h3>TOOL HTUNGG</h3>
      <div class="sub">Dự đoán Tài Xỉu • Real-time</div>
    </div>
    <div class="ds-game" id="ds-game">
      <div class="empty-state">Đang tải danh sách...</div>
    </div>
  </div>
</div>

<!-- MAIN VIEW -->
<div class="khung">
  <div class="thanh-tren">
    <div class="logo">
      <div class="logo-icon">TX</div>
      <div class="logo-text">
        <span class="lg-main">TOOL HTUNGG</span>
        <span class="credit">v15.5</span>
      </div>
    </div>
    <div class="btn-group">
      <button class="nut reset" onclick="resetLearn()">RESET</button>
      <button class="nut secondary" onclick="quayLai()">ĐỔI GAME</button>
    </div>
  </div>

  <div class="info-bar" id="info-bar" style="display:none">
    <div class="info-game">
      <div class="ten-game" id="info-ten">—</div>
      <div class="phien" id="info-phien">Phiên: —</div>
    </div>
    <div class="info-stats">
      <div class="thong-ke">
        <div class="so" id="stat-thang">0</div>
        <div class="nhan">THẮNG</div>
      </div>
      <div class="thong-ke">
        <div class="so" id="stat-thua">0</div>
        <div class="nhan">THUA</div>
      </div>
      <div class="thong-ke">
        <div class="so" id="stat-tile">0%</div>
        <div class="nhan">TỈ LỆ</div>
      </div>
    </div>
  </div>

  <div class="vung-bang">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>GAME</th>
            <th>PHIÊN</th>
            <th>THỜI GIAN</th>
            <th>DỰ ĐOÁN</th>
            <th>KẾT QUẢ</th>
            <th>XÁC MINH</th>
          </tr>
        </thead>
        <tbody id="bang-du-lieu">
          <tr>
            <td colspan="6" style="text-align:center; padding:48px; color:#94a3b8;">
              Chọn game để bắt đầu...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
let gameDangChon = null;
let vongLapChiTiet = null;
let lastHash = '';

async function taiDanhSachGame() {
  try {
    const res = await fetch('/api/games');
    const json = await res.json();
    const list = json.games || [];

    // Chỉ lấy game Tài Xỉu (không lấy sicbo vị, md5...)
    const txGames = list.filter(g => g.group === 'tx' || !g.group || g.group === 'taixiu');

    let html = '';
    if (txGames.length === 0) {
      html = '<div class="empty-state">Không có game nào</div>';
    } else {
      html += `<div class="phan-loai">TÀI XỈU</div>`;
      for (const g of txGames) {
        const predClass = g.pred === 'TÀI' ? 'tag-tai' : 'tag-xiu';
        html += `
          <div class="o-game" onclick="chonGame('${g.id}', '${g.name}')">
            <div class="left">
              <span class="name">${g.name}</span>
              <span class="pred-mini">
                Dự đoán: <span class="${predClass}">${g.pred}</span>
                <span style="color:#94a3b8; font-size:11px;">(${g.conf}%)</span>
              </span>
            </div>
            <div class="winrate">${g.acc}%</div>
          </div>
        `;
      }
    }

    document.getElementById('ds-game').innerHTML = html;
  } catch (e) {
    console.error('Lỗi tải danh sách', e);
    document.getElementById('ds-game').innerHTML = '<div class="empty-state">Lỗi tải danh sách</div>';
  }
}

function chonGame(id, name) {
  gameDangChon = id;
  document.getElementById('modal-chon').style.display = 'none';
  document.getElementById('info-bar').style.display = 'flex';
  document.getElementById('info-ten').innerText = name;
  document.getElementById('bang-du-lieu').innerHTML = `
    <tr>
      <td colspan="6" style="text-align:center; padding:40px; color:#94a3b8;">
        Đang tải dữ liệu...
      </td>
    </tr>`;
  lastHash = '';
  if (vongLapChiTiet) clearInterval(vongLapChiTiet);
  taiChiTiet();
  vongLapChiTiet = setInterval(taiChiTiet, 3000);
}

function quayLai() {
  if (vongLapChiTiet) {
    clearInterval(vongLapChiTiet);
    vongLapChiTiet = null;
  }
  document.getElementById('modal-chon').style.display = 'flex';
  document.getElementById('info-bar').style.display = 'none';
  document.getElementById('bang-du-lieu').innerHTML = `
    <tr>
      <td colspan="6" style="text-align:center; padding:48px; color:#94a3b8;">
        Chọn game để bắt đầu...
      </td>
    </tr>`;
  taiDanhSachGame();
}

async function taiChiTiet() {
  if (!gameDangChon) return;
  try {
    const res = await fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ apiId: gameDangChon })
    });
    const json = await res.json();
    if (!json.rows || json.rows.length === 0) return;

    const hash = json.rows.map(r => r.phien + r.result + r.verify).join('|');
    if (hash === lastHash) return;
    lastHash = hash;

    let html = '';
    let thang = 0, thua = 0;

    for (const r of json.rows) {
      if (r.isNext) {
        document.getElementById('info-phien').innerText = 'Phiên: #' + r.phien;
        const predClass = r.prediction.includes('Tài') || r.prediction.includes('TÀI') ? 'tai' : 'xiu';
        html += `<tr class="hang-tiep">
          <td><span style="color:var(--primary);font-weight:800;">${r.game}</span></td>
          <td style="font-family:var(--font-mono);">#${r.phien}</td>
          <td style="font-size:11px;color:#94a3b8;">${r.time}</td>
          <td><span class="pill ${predClass}">${r.prediction}</span></td>
          <td class="cho">Chờ...</td>
          <td class="cho">...</td>
        </tr>`;
      } else {
        if (r.isCorrect === true) thang++;
        else if (r.isCorrect === false) thua++;

        const predClass = r.prediction.includes('Tài') || r.prediction.includes('TÀI') ? 'tai' : 'xiu';
        const resClass = r.result.includes('Tài') || r.result.includes('TÀI') ? 'tai' : 'xiu';
        const verClass = r.isCorrect ? 'dung' : 'sai';

        html += `<tr>
          <td><span style="color:var(--primary);font-weight:800;">${r.game}</span></td>
          <td style="font-family:var(--font-mono);">#${r.phien}</td>
          <td style="font-size:11px;color:#94a3b8;">${r.time}</td>
          <td><span class="pill ${predClass}">${r.prediction}</span></td>
          <td><span class="pill ${resClass}">${r.result}</span></td>
          <td><span class="verify ${verClass}">${r.verify}</span></td>
        </tr>`;
      }
    }

    document.getElementById('bang-du-lieu').innerHTML = html;

    const total = thang + thua;
    document.getElementById('stat-thang').innerText = thang;
    document.getElementById('stat-thua').innerText = thua;
    document.getElementById('stat-tile').innerText = total ? ((thang / total) * 100).toFixed(0) + '%' : '0%';
  } catch (e) {
    console.error(e);
  }
}

async function resetLearn() {
  if (!gameDangChon) return alert('Vui lòng chọn game trước!');
  if (!confirm('Reset dữ liệu học máy của game này?')) return;
  await fetch('/reset-learn', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ apiId: gameDangChon })
  });
  lastHash = '';
  taiChiTiet();
}

taiDanhSachGame();
setInterval(() => {
  if (document.getElementById('modal-chon').style.display !== 'none') {
    taiDanhSachGame();
  }
}, 5000);
</script>
</body>
</html>
